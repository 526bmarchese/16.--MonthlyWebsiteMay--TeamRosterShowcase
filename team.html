<!doctype html>
<html lang="en">
    <head>
        <title>Team Roster | Players</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="imgs/favicon.png">
    </head>

    <body>
        <header>
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container">
                    <a class="navbar-brand" href="index.html">Team Roster</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="about.html">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="team.html">Team Roster</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        
        <main>
            <section class="py-5 bg-light">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-8 mx-auto text-center">
                            <h1 class="display-4 fw-bold mb-4">Meet Our Team</h1>
                            <p class="lead">The talented players who make it all happen on the field.</p>
                        </div>
                    </div>
                </div>
            </section>
            
            <section class="py-5">
                <div class="container">
                    <div class="roster-controls mb-4">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <select id="positionFilter" class="form-select">
                                    <option value="All">All Positions</option>
                                    <option value="P">Pitchers</option>
                                    <option value="C">Catchers</option>
                                    <option value="1B">First Base</option>
                                    <option value="2B">Second Base</option>
                                    <option value="3B">Third Base</option>
                                    <option value="SS">Shortstop</option>
                                    <option value="LF">Left Field</option>
                                    <option value="CF">Center Field</option>
                                    <option value="RF">Right Field</option>
                                    <option value="DH">Designated Hitter</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select id="sortOrder" class="form-select">
                                    <option value="name">Sort by Name</option>
                                    <option value="age">Sort by Age</option>
                                    <option value="position">Sort by Position</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <div class="input-group">
                                    <input type="text" id="searchInput" class="form-control" placeholder="Search players...">
                                    <button class="btn btn-outline-secondary" type="button" id="clearSearch">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="rosterGrid" class="row g-4">>
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="bg-dark text-white py-4">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Team Roster</h5>
                        <p class="mb-0">© 2025 All Rights Reserved</p>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <ul class="list-inline mb-0">
                            <li class="list-inline-item"><a href="index.html" class="text-white">Home</a></li>
                            <li class="list-inline-item"><a href="about.html" class="text-white">About</a></li>
                            <li class="list-inline-item"><a href="team.html" class="text-white">Team Roster</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
        <script src="players.js"></script>
        <script src="roster.js"></script>
    </body>
</html>
